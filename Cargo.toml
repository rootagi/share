[package]
name = "share"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast LAN file and directory sharing with a terminal UI and a browser UI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rootagi/share"
homepage = "https://github.com/rootagi/share"
keywords = ["file-sharing", "lan", "http", "tui", "cli"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "share"
path = "src/lib.rs"

[[bin]]
name = "share"
path = "src/main.rs"

[dependencies]
# Async runtime and HTTP stack
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "query", "json"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
httpdate = "1"
percent-encoding = "2"
mime_guess = "2"
flate2 = "1.1"
base64 = "0.22"
rand = "0.8"

# TLS
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
time = "0.3"

# Terminal UI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
qrcode = { version = "0.14", default-features = false }
open = "5"

# CLI, config, errors, logging, data
clap = { version = "4", features = ["derive", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std", "ansi"] }
if-addrs = "0.15"

[target.'cfg(unix)'.dependencies]
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 1
